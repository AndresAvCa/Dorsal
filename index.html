<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador de dorsals</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container">
<h1>Generador de dorsals</h1>
<div class="controls">
<label>Color base <input type="color" id="color"></label>
<label>Nom de la cursa <input type="text" id="race" value="NOM DE LA CURSA"></label>
<label>Nom <input type="text" id="name" value="NOM"></label>
<label>Número dorsal <input type="number" id="bib" min="0" max="9999" value="0"></label>
<label>Running club o frase divertida <input type="text" id="club" value="RUNNING CLUB O FRASE DIVERTIDA"></label>
<button id="download">Descarrega PDF</button>
</div>
<div class="preview-wrap">
<h3>Vista prèvia (21 × 15 cm)</h3>
<div id="bibCard" class="bib-card">
<div class="band top"><span id="racePreview"></span></div>
<div class="middle"><div id="namePreview"></div><div id="bibPreview"></div></div>
<div class="band bottom"><span id="clubPreview"></span></div>
</div>
</div></div>
<script src="script.js"></script>
</body></html>
